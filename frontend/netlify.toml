[build]
  base      = "."
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_FORCE_MOCK = "true"

# Force /api and /ws to real 404s so the SPA catch-all never returns index.html as "API"
[[redirects]]
  from   = "/api/*"
  to     = "/offline.json"
  status = 404
  force  = true

[[redirects]]
  from   = "/ws/*"
  to     = "/offline.json"
  status = 404
  force  = true

# SPA routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
